$('#main').innerHTML=`<div class="bar"><label>Year${sel('fy',yrs(),F.yr,"setF('yr',this.value)")}</label><label>Dept${sel('fd',['All',...S.set.depts],F.dept,"setF('dept',this.value)")}</label><label>Month${sel('fm',['All',...MON],F.mo,"setF('mo',this.value)")}</label><span class="note">As of ${A}</span></div>
<div class="kpis">${kp('Total orders',nf(L.length),L.length?nf(sum(L,'tp')/L.length)+' pcs per order (avg)':'')}${kp('Total pieces',nf(sum(L,'tp')))}${kp('Value (USD equiv.)',nf(sum(L,'usd')),'EUR @ '+(+S.set.eur).toFixed(2))}${kp('USD orders value',nf(sum(L.filter(o=>o.cur==='USD'),'val')))}${kp('EUR orders value',nf(sum(L.filter(o=>o.cur==='EUR'),'val')))}</div>
<div class="kpis">${kp('Shipped orders',nf(sh.length),L.length?Math.round(sh.length/L.length*100)+'% of all orders':'')}${kp('On-time rate',sh.length?Math.round(ot/sh.length*100)+'%':'-')}${kp('Late shipments',nf(sh.length-ot))}${kp('Pending past ship date',nf(pend.filter(o=>o.ship<A).length))}${kp('Due next 30 days',nf(pend.filter(o=>o.ship>=A&&o.ship<=a30).length))}</div>
<div class="grid"><div class="c"><h3>Shipment trend (by ship month)</h3><canvas id="c1"></canvas></div><div class="c"><h3>Delivery status</h3><canvas id="c2"></canvas></div>
<div class="c"><h3>Orders by department</h3><canvas id="c3"></canvas></div><div class="c"><h3>Yarn requirement by count (kg)</h3><canvas id="c4"></canvas></div></div>
<div class="c"><h3>Department summary (follows Year &amp; Month filter)</h3><div id="dt"></div></div>`;
const T=all.filter(o=>f(o,0,1));const st=(s)=>MON.map((m,i)=>T.filter(o=>o.mo===i&&o.st===s).length);
mk('c1',{type:'bar',data:{labels:MON,datasets:[['On Time','#1a8f5a'],['Late','#d1453b'],['Pending','#c98a10']].map(([s,c])=>({label:s,data:st(s),backgroundColor:c}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
mk('c2',{type:'doughnut',data:{labels:['On Time','Late','Pending'],datasets:[{data:['On Time','Late','Pending'].map(s=>L.filter(o=>o.st===s).length),backgroundColor:['#1a8f5a','#d1453b','#c98a10']}]}});
const D=all.filter(o=>f(o,1,0)),dp=S.set.depts;
mk('c3',{type:'bar',data:{labels:dp,datasets:[{label:'Orders',data:dp.map(d=>D.filter(o=>o.dept===d).length),backgroundColor:'#4a7bd0'}]},options:{plugins:{legend:{display:false}}}});
const ys=S.set.yarns,yk=ys.map(y=>L.reduce((s,o)=>s+[1,2,3,4].reduce((t,n)=>t+(o['y'+n]===y?o.yk[n-1]:0),0),0));
mk('c4',{type:'bar',data:{labels:ys,datasets:[{label:'kg',data:yk.map(v=>Math.round(v)),backgroundColor:'#8a6fd1'}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});
const rows=dp.map(d=>{const x=D.filter(o=>o.dept===d),s=x.filter(o=>o.act);return `<tr><td>${esc(d)}</td><td class="n">${nf(x.length)}</td><td class="n">${nf(sum(x,'tp'))}</td><td class="n">${nf(sum(x,'usd'))}</td><td class="n">${s.length?Math.round(s.filter(o=>o.st==='On Time').length/s.length*100)+'%':'-'}</td></tr>`});
const s2=D.filter(o=>o.act);rows.push(`<tr class="tot"><td>Total (all depts)</td><td class="n">${nf(D.length)}</td><td class="n">${nf(sum(D,'tp'))}</td><td class="n">${nf(sum(D,'usd'))}</td><td class="n">${s2.length?Math.round(s2.filter(o=>o.st==='On Time').length/s2.length*100)+'%':'-'}</td></tr>`);
$('#dt').innerHTML=tbl(['Dept','Orders','Total pcs','Value (USD eq.)','On-time %'],rows,[1,2,3,4])};

/* ---------- Data Entry ---------- */
V.data=()=>{const all=orders(),cnt={};all.forEach(o=>cnt[o.po]=(cnt[o.po]||0)+1);const dups=Object.values(cnt).filter(c=>c>1).length;
const q=DE.q.toLowerCase(),L=all.filter(o=>!q||[o.po,o.style,o.desc,o.dept].join(' ').toLowerCase().includes(q)),P=100,pgs=Math.max(1,Math.ceil(L.length/P));DE.pg=Math.min(DE.pg,pgs-1);
const rows=L.slice(DE.pg*P,DE.pg*P+P).map(o=>`<tr class="${cnt[o.po]>1?'dup':''}"><td>${esc(o.style)}</td><td>${esc(o.desc)}</td><td>${esc(o.dept)}</td><td>${esc(o.po)}</td><td class="n">${nf(o.pack)}</td><td class="n">${nf(o.tp)}</td><td>${o.ship}</td><td>${o.act||''}</td><td>${o.cur}</td><td class="n">${nf(o.val,2)}</td><td>${tag(o.st)}</td><td class="n">${o.req?nf(o.req):''}</td><td><button class="g" onclick="editO('${o.id}')">Edit</button> <button class="g" id="x${o.id}" onclick="delO('${o.id}')">Delete</button></td></tr>`);
$('#main').innerHTML=`<div class="bar"><label>Search PO / style / dept<input id="dq" value="${esc(DE.q)}" oninput="DE.q=this.value;DE.pg=0;V.data();$('#dq').focus();$('#dq').setSelectionRange(99,99)"></label><button class="b" onclick="EF.id=null;show('form')">+ New order</button><span class="note">Records ${nf(all.length)} &nbsp;|&nbsp; Duplicate POs ${dups} (red rows)</span></div>
${tbl(['Style','Description','Dept','PO','Pack qty','Total pcs','Ship date','Actual ship','Cur','Value','Status','Yarn kg',''],rows,[4,5,9,11])}
<p class="note">Showing ${nf(L.length?DE.pg*P+1:0)}&ndash;${nf(Math.min(L.length,DE.pg*P+P))} of ${nf(L.length)} &nbsp; <button class="g" onclick="DE.pg=Math.max(0,DE.pg-1);V.data()">Prev</button> <button class="g" onclick="DE.pg=Math.min(${pgs-1},DE.pg+1);V.data()">Next</button></p>`};
function editO(id){EF.id=id;show('form')}
function delO(id){const b=$('#x'+id);if(b.dataset.a!=='1'){b.dataset.a='1';b.textContent='Sure?';return}if(id[0]==='b')S.ov[id]=null;else S.added=S.added.filter(o=>o.id!==id);save();V.data()}

/* ---------- Entry Form ---------- */
V.form=()=>{const o=EF.id?orders().find(x=>x.id===EF.id):null,v=k=>o&&o[k]!=null?esc(o[k]):'',ys=['',...S.set.yarns];
const inp=(k,l,t='text',x='')=>`<label>${l}<input id="f_${k}" type="${t}" value="${v(k)}" ${x}></label>`;
$('#main').innerHTML=`<div class="c"><h3>${o?'Edit order':'New order entry form'}</h3><div class="form">${inp('style','Style name')}${inp('desc','Description')}<label>Dept${sel('f_dept',S.set.depts,o?o.dept:S.set.depts[0],'')}</label>${inp('po','PO')}${inp('pack','Pack qty','number')}${inp('pcs','Pcs / pack','number')}${inp('ship','Ship date','date')}${inp('act','Actual ship date','date')}<label>Currency${sel('f_cur',['USD','EUR'],o?o.cur:'USD','')}</label>${inp('fob','FOB (per pack)','number','step="any"')}${inp('cons','Consumption (kg/dz)','number','step="any"')}</div>
<h3 style="margin-top:14px">Yarn composition (up to 4 counts, total 100%)</h3><div class="form">${[1,2,3,4].map(n=>`<label>Yarn count ${n}${sel('f_y'+n,ys,o?o['y'+n]||'':'','calcP()')}</label><label>Share %<input id="f_p${n}" type="number" step="any" value="${o&&o['p'+n]?+(o['p'+n]*100).toFixed(2):''}" oninput="calcP()"></label>`).join('')}</div>
<p class="msg" id="fmsg"></p><button class="b" onclick="subO()">${o?'Save changes':'Submit'}</button> <button class="g" onclick="EF.id=null;V.form()">Clear</button> <button class="g" onclick="show('data')">Back to Data Entry</button></div>`;calcP()};
function calcP(){const t=[1,2,3,4].reduce((s,n)=>s+(+$('#f_p'+n).value||0),0),c=$('#f_cons').value;$('#fmsg').innerHTML=(t||c)?`Total % : <b>${+t.toFixed(2)}</b> ${Math.abs(t-100)<.01?'<span class="pos">OK</span>':'<span class="neg">must be 100%</span>'}`:''}
function subO(){const g=k=>$('#f_'+k).value.trim(),o={};['style','desc','dept','po','cur','ship','act'].forEach(k=>o[k]=g(k));['pack','pcs','fob','cons'].forEach(k=>o[k]=g(k)===''?'':+g(k));
[1,2,3,4].forEach(n=>{o['y'+n]=g('y'+n);o['p'+n]=o['y'+n]?(+g('p'+n)||0)/100:''});
const m=$('#fmsg');if(!o.po){m.innerHTML='<span class="neg">PO is required</span>';return}
if(orders().some(x=>x.po===o.po&&x.id!==EF.id)){m.innerHTML='<span class="neg">This PO already exists</span>';return}
if(!o.ship){m.innerHTML='<span class="neg">Ship date is required</span>';return}
const t=[1,2,3,4].reduce((s,n)=>s+(o['p'+n]||0),0);if(o.cons&&Math.abs(t-1)>1e-4){m.innerHTML='<span class="neg">Yarn shares must total 100%</span>';return}
if(EF.id){o.id=EF.id;if(EF.id[0]==='b')S.ov[EF.id]=o;else S.added=S.added.map(x=>x.id===EF.id?o:x)}else{o.id='n'+Date.now();S.added.push(o)}
save();EF.id=null;show('data')}

/* ---------- PO Lookup ---------- */
let POQ='';
V.po=()=>{$('#main').innerHTML=`<div class="bar"><label>Enter PO number<input id="pq" value="${esc(POQ)}" oninput="POQ=this.value;poRes()" style="min-width:260px"></label></div><div id="pr"></div>`;poRes()};
function poRes(){const q=POQ.trim().toLowerCase(),o=q&&orders().find(x=>String(x.po).toLowerCase()===q),r=$('#pr');if(!q){r.innerHTML='<p class="note">Type or paste a PO number</p>';return}if(!o){r.innerHTML='<p class="neg">PO not found</p>';return}
const kv=(a)=>a.map(([k,v])=>`<tr><td class="note">${k}</td><td>${v}</td></tr>`).join('');
const yy=[1,2,3,4].filter(n=>o['y'+n]).map(n=>`${esc(o['y'+n])} ${+(o['p'+n]*100).toFixed(1)}% = ${nf(o.yk[n-1],1)} kg`).join('<br>')||'-';
r.innerHTML=`<div class="grid"><div class="c"><h3>Order</h3><table>${kv([['Style',esc(o.style)],['Description',esc(o.desc)],['Dept',esc(o.dept)],['PO',esc(o.po)],['Pack qty',nf(o.pack)],['Pcs / pack',o.pcs],['Total pcs',nf(o.tp)]])}</table></div>
<div class="c"><h3>Shipment</h3><table>${kv([['Ship date',o.ship],['Actual ship date',o.act||'-'],['Days early(+) / late(-)',o.days==null?'-':o.days],['Status',tag(o.st)],['Ship month',MON[o.mo]||'-']])}</table></div>
<div class="c"><h3>Price &amp; value</h3><table>${kv([['Currency',o.cur],['FOB (per pack)',o.fob],['Total value',nf(o.val,2)]])}</table></div>
<div class="c"><h3>Yarn summary</h3><table>${kv([['Consumption (kg/dz)',o.cons||'-'],['Total yarn (kg)',o.req?nf(o.req,1):'-'],['Breakdown',yy]])}</table></div></div>`}

/* ---------- Yarn Booking ---------- */
V.yb=()=>{const L=orders().filter(o=>(YB.yr==='All'||o.yr==YB.yr)&&(YB.dept==='All'||o.dept===YB.dept)),ys=S.set.yarns;
const kg=(m,y)=>L.filter(o=>o.mo===m).reduce((s,o)=>s+[1,2,3,4].reduce((t,n)=>t+(o['y'+n]===y?o.yk[n-1]:0),0),0);
const rows=MON.map((mn,m)=>{const v=ys.map(y=>kg(m,y));return `<tr><td>${mn}</td>${v.map(x=>`<td class="n">${x?nf(x):'-'}</td>`).join('')}<td class="n"><b>${nf(v.reduce((a,b)=>a+b,0))}</b></td></tr>`});
const tv=ys.map(y=>MON.reduce((s,_,m)=>s+kg(m,y),0));rows.push(`<tr class="tot"><td>Total</td>${tv.map(x=>`<td class="n">${nf(x)}</td>`).join('')}<td class="n">${nf(tv.reduce((a,b)=>a+b,0))}</td></tr>`);
$('#main').innerHTML=`<div class="bar"><label>Year${sel('yy',yrs(),YB.yr,"YB.yr=this.value;V.yb()")}</label><label>Dept${sel('yd',['All',...S.set.depts],YB.dept,"YB.dept=this.value;V.yb()")}</label></div><p class="note">Monthly yarn booking (kg) = (Consumption / 12 x Total pcs) / yield x Yarn %, month = ship month</p><div class="c">${tbl(['Month',...ys.map(esc),'Total kg'],rows,ys.map((_,i)=>i+1).concat([ys.length+1]))}</div>`};

/* ---------- Yarn Purchase (new) ---------- */
function usedList(){const A=asof(),out=[];orders().forEach(o=>{if(!o.req)return;const d=YP.basis==='act'?o.act:o.ship;if(!d||(YP.basis==='asof'&&d>A))return;[1,2,3,4].forEach(n=>{if(o['y'+n]&&o.yk[n-1])out.push({d,y:o['y'+n],kg:o.yk[n-1]})})});return out}
const inR=d=>(!YP.from||d>=YP.from)&&(!YP.to||d<=YP.to);
function ypData(){const P=S.pur.filter(p=>inR(p.d)&&(YP.y==='All'||p.y===YP.y)),U=usedList().filter(u=>inR(u.d)&&(YP.y==='All'||u.y===YP.y));
const ys=[...new Set([...S.set.yarns,...P.map(p=>p.y),...U.map(u=>u.y)])].filter(y=>YP.y==='All'||y===YP.y);
const sm=ys.map(y=>{const p=P.filter(x=>x.y===y).reduce((s,x)=>s+(+x.qty||0),0),u=U.filter(x=>x.y===y).reduce((s,x)=>s+x.kg,0);return{y,p,u,b:p-u}}).filter(r=>r.p||r.u);
const mo={};P.forEach(p=>{const k=p.d.slice(0,7);(mo[k]=mo[k]||{p:0,u:0}).p+=+p.qty||0});U.forEach(u=>{const k=u.d.slice(0,7);(mo[k]=mo[k]||{p:0,u:0}).u+=u.kg});return{P,U,sm,mo}}
V.yp=()=>{const{P,sm,mo}=ypData(),tp=sm.reduce((s,r)=>s+r.p,0),tu=sm.reduce((s,r)=>s+r.u,0),bc=v=>`<span class="${v<0?'neg':'pos'}">${nf(v)}</span>`;
let run=0;const led=Object.keys(mo).sort().map(k=>{run+=mo[k].p-mo[k].u;return `<tr><td>${k}</td><td class="n">${nf(mo[k].p)}</td><td class="n">${nf(mo[k].u)}</td><td class="n">${bc(mo[k].p-mo[k].u)}</td><td class="n">${bc(run)}</td></tr>`});
const log=[...P].sort((a,b)=>b.d.localeCompare(a.d)).map(p=>`<tr><td>${p.d}</td><td>${esc(p.y)}</td><td>${esc(p.sup)}</td><td>${esc(p.ref)}</td><td class="n">${nf(p.qty,1)}</td><td><button class="g" id="p${p.id}" onclick="delP('${p.id}')">Delete</button></td></tr>`);
$('#main').innerHTML=`<div class="c" style="margin-bottom:12px"><h3>Add yarn purchase</h3><div class="form"><label>Date<input id="pd" type="date" value="${today()}"></label><label>Yarn count${sel('py',S.set.yarns,S.set.yarns[0],'')}</label><label>Supplier<input id="ps"></label><label>Invoice / ref<input id="pr2"></label><label>Qty (kg)<input id="pk" type="number" step="any"></label></div><p class="msg" id="pm"></p><button class="b" onclick="addP()">Add purchase</button></div>
<div class="bar"><label>From<input type="date" value="${YP.from}" onchange="YP.from=this.value;V.yp()"></label><label>To<input type="date" value="${YP.to}" onchange="YP.to=this.value;V.yp()"></label><label>Yarn count${sel('yf',['All',...S.set.yarns],YP.y,"YP.y=this.value;V.yp()")}</label><label>Used yarn basis<select onchange="YP.basis=this.value;V.yp()"><option value="act"${YP.basis==='act'?' selected':''}>Shipped orders (actual ship date)</option><option value="asof"${YP.basis==='asof'?' selected':''}>Ship date up to as-of date</option><option value="all"${YP.basis==='all'?' selected':''}>All booked orders (ship date)</option></select></label><button class="g" onclick="expP()">Export CSV</button></div>
<div class="kpis"><div class="k"><small>Total purchased (kg)</small><b>${nf(tp)}</b></div><div class="k"><small>Used yarn (kg)</small><b>${nf(tu)}</b></div><div class="k"><small>Balance yarn (kg)</small><b>${bc(tp-tu)}</b><span>${tp-tu<0?'Short: used more than purchased':'Purchased - used'}</span></div></div>
<div class="c" style="margin-bottom:12px"><h3>Yarn purchase report by count</h3>${tbl(['Yarn count','Purchased kg','Used kg','Balance kg','Used %'],sm.map(r=>`<tr><td>${esc(r.y)}</td><td class="n">${nf(r.p)}</td><td class="n">${nf(r.u)}</td><td class="n">${bc(r.b)}</td><td class="n">${r.p?Math.round(r.u/r.p*100)+'%':'-'}</td></tr>`).concat([`<tr class="tot"><td>Total</td><td class="n">${nf(tp)}</td><td class="n">${nf(tu)}</td><td class="n">${bc(tp-tu)}</td><td class="n">${tp?Math.round(tu/tp*100)+'%':'-'}</td></tr>`]),[1,2,3,4])}</div>
<div class="grid"><div class="c"><h3>Monthly ledger (running balance)</h3>${tbl(['Month','Purchased','Used','Net','Balance'],led,[1,2,3,4])}</div><div class="c"><h3>Purchase log</h3>${tbl(['Date','Yarn count','Supplier','Ref','Qty kg',''],log,[4])}</div></div>
<p class="note">Used yarn comes from Data Entry: (Consumption / 12 x Total pcs) / yield x Yarn %. Balance = purchased - used within the selected dates.</p>`};
function addP(){const q=+$('#pk').value,d=$('#pd').value;if(!d||!(q>0)){$('#pm').innerHTML='<span class="neg">Enter a date and a quantity</span>';return}
S.pur.push({id:'p'+Date.now(),d,y:$('#py').value,sup:$('#ps').value.trim(),ref:$('#pr2').value.trim(),qty:q});save();V.yp()}
function delP(id){const b=$('#p'+id);if(b.dataset.a!=='1'){b.dataset.a='1';b.textContent='Sure?';return}S.pur=S.pur.filter(p=>p.id!==id);save();V.yp()}
async function expP(){const{sm}=ypData(),c=['Yarn count,Purchased kg,Used kg,Balance kg',...sm.map(r=>`"${r.y}",${r.p.toFixed(1)},${r.u.toFixed(1)},${r.b.toFixed(1)}`),'','Date,Yarn count,Supplier,Ref,Qty kg',...S.pur.map(p=>`${p.d},"${p.y}","${p.sup}","${p.ref}",${p.qty}`)].join('\n');
try{const d=await claude.use('downloads');if(d)await d.save({filename:'yarn_purchase_report.csv',data:c})}catch(e){}}

/* ---------- Settings ---------- */
V.set=()=>{const s=S.set;$('#main').innerHTML=`<div class="c"><h3>Assumptions</h3><div class="form"><label>EUR to USD rate<input id="s1" type="number" step="any" value="${s.eur}"></label><label>Yarn yield factor<input id="s2" type="number" step="any" value="${s.yld}"></label><label>On-time threshold (days)<input id="s3" type="number" value="${s.thr}"></label><label>As-of date (blank = today)<input id="s4" type="date" value="${s.asof}"></label></div>
<div class="form" style="margin-top:10px"><label>Yarn count list (one per line)<textarea id="s5" rows="10">${esc(s.yarns.join('\n'))}</textarea></label><label>Dept list (one per line)<textarea id="s6" rows="6">${esc(s.depts.join('\n'))}</textarea></label></div>
<p class="note">EUR rate is a placeholder, enter your current rate. Yarn kg = (Consumption / 12 x Total pcs) / yield x %. Late if (Ship date - Actual ship date) is less than the threshold. PO numbers must be unique.</p><button class="b" onclick="subS()">Save settings</button> <span id="sm" class="pos"></span></div>`};
function subS(){const l=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);Object.assign(S.set,{eur:+$('#s1').value||1,yld:+$('#s2').value||.88,thr:+$('#s3').value,asof:$('#s4').value,yarns:l('#s5'),depts:l('#s6')});save();$('#sm').textContent='Saved'}

try{adopt(localStorage.getItem('osd')||'{}')}catch(e){}
show('dash');
(async()=>{try{if(!window.claude)return;DB=await claude.use('db');if(!DB)return;const s=await DB.doc('app/state').get();if(s.exists&&s.data().json){adopt(s.data().json);show(tab)}}catch(e){}})();
</script></body></html>
